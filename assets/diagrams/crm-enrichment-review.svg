<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 880" font-family="ui-monospace, SFMono-Regular, Menlo, 'JetBrains Mono', monospace" role="img" aria-label="CRM enrichment with change review: gate the spend, research with citations, date every fact, propose changes side by side, a person reviews, every change reversible, evaluated on golden records.">
  <defs>
    <marker id="e-arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#4A9ECE" stroke-width="1.4"/>
    </marker>
    <marker id="e-arrdim" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L7.5,4 L0,7.5" fill="none" stroke="#484F58" stroke-width="1.4"/>
    </marker>
    <filter id="e-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="e-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(74,158,206,0.10)"/>
    </pattern>
  </defs>

  <rect width="745" height="880" fill="#0d1117"/>
  <rect width="745" height="880" fill="url(#e-dots)"/>

  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <path d="M372,98 V122" marker-end="url(#e-arr)" stroke="#4A9ECE"/>
    <path d="M372,188 V212" marker-end="url(#e-arr)" stroke="#4A9ECE"/>
    <!-- spend gate skip branch -->
    <path d="M512,148 H582" marker-end="url(#e-arrdim)" stroke="#E5C07B" stroke-dasharray="4 4"/>
    <path d="M582,168 H516" marker-end="url(#e-arrdim)" stroke="#484F58" stroke-dasharray="4 4"/>
    <path d="M372,288 V312" stroke="#4A9ECE"/>
    <!-- evidence split -->
    <path d="M222,312 H522"/>
    <path d="M222,312 V336" marker-end="url(#e-arrdim)"/>
    <path d="M522,312 V336" marker-end="url(#e-arrdim)"/>
    <path d="M222,404 V428"/>
    <path d="M522,404 V428"/>
    <path d="M222,428 H522"/>
    <path d="M372,428 V452" marker-end="url(#e-arr)" stroke="#4A9ECE"/>
    <path d="M372,528 V552" marker-end="url(#e-arr)" stroke="#4A9ECE"/>
    <path d="M372,626 V650" marker-end="url(#e-arr)" stroke="#4A9ECE"/>
    <!-- golden records eval loop -->
    <path d="M522,588 H700 V250 H512" stroke="#484F58" stroke-dasharray="5 5" marker-end="url(#e-arrdim)"/>
    <!-- outputs -->
    <path d="M372,714 V730" stroke="#30363d"/>
    <path d="M232,730 H512"/>
    <path d="M232,730 V750" marker-end="url(#e-arrdim)"/>
    <path d="M512,730 V750" marker-end="url(#e-arrdim)"/>
  </g>

  <circle r="3.2" fill="#4A9ECE" filter="url(#e-glow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M372,55 V122 V212 V312 M372,312 H222 V428 H372 V452 M372,452 V552 V650 V730 H250"/>
  </circle>

  <!-- 1 incomplete record -->
  <g>
    <rect x="242" y="34" width="260" height="64" rx="9" fill="#1c2333" stroke="#E06C75"/>
    <text x="372" y="60" text-anchor="middle" fill="#E06C75" font-size="14" font-weight="700">INCOMPLETE RECORD</text>
    <text x="372" y="78" text-anchor="middle" fill="#8B949E" font-size="10">gaps, stale fields, unknowns</text>
  </g>

  <!-- 2 spend gate -->
  <g>
    <rect x="232" y="122" width="280" height="66" rx="9" fill="#1c2333" stroke="#E5C07B"/>
    <text x="372" y="148" text-anchor="middle" fill="#E5C07B" font-size="14" font-weight="700">SPEND GATE</text>
    <text x="372" y="166" text-anchor="middle" fill="#8B949E" font-size="10">enrich only what something will use,</text>
    <text x="372" y="180" text-anchor="middle" fill="#8B949E" font-size="10">capped per day</text>
  </g>
  <g>
    <rect x="582" y="128" width="130" height="54" rx="9" fill="#1c2333" stroke="#30363d"/>
    <text x="647" y="148" text-anchor="middle" fill="#8B949E" font-size="10" font-weight="700">NOT YET</text>
    <text x="647" y="162" text-anchor="middle" fill="#8B949E" font-size="8.5">queued &#183; drains in the cap,</text>
    <text x="647" y="174" text-anchor="middle" fill="#8B949E" font-size="8.5">expires and re-qualifies</text>
  </g>

  <!-- 3 research -->
  <g>
    <rect x="222" y="212" width="300" height="76" rx="9" fill="#161b22" stroke="#4A9ECE" stroke-opacity="0.5"/>
    <text x="372" y="238" text-anchor="middle" fill="#E6EDF3" font-size="15" font-weight="700">RESEARCH AGENT</text>
    <text x="372" y="256" text-anchor="middle" fill="#4A9ECE" font-size="10.5">public sources &#183; every claim cited</text>
    <text x="372" y="272" text-anchor="middle" fill="#8B949E" font-size="10">unknown stays unknown, never guessed</text>
  </g>

  <!-- 4 evidence split -->
  <g>
    <rect x="117" y="336" width="210" height="68" rx="9" fill="#1c2333" stroke="#98C379"/>
    <text x="222" y="362" text-anchor="middle" fill="#98C379" font-size="12" font-weight="700">FRESH EVIDENCE</text>
    <text x="222" y="380" text-anchor="middle" fill="#8B949E" font-size="9.5">dated, sourced, usable</text>
  </g>
  <g>
    <rect x="417" y="336" width="210" height="68" rx="9" fill="#1c2333" stroke="#E06C75"/>
    <text x="522" y="358" text-anchor="middle" fill="#E06C75" font-size="11.5" font-weight="700">STALE OR CONFLICTING</text>
    <text x="522" y="376" text-anchor="middle" fill="#8B949E" font-size="9.5">surfaced as conflicts and</text>
    <text x="522" y="390" text-anchor="middle" fill="#8B949E" font-size="9.5">suppressions &#183; never silent</text>
  </g>

  <!-- 5 proposed changes -->
  <g>
    <rect x="222" y="452" width="300" height="76" rx="9" fill="#1c2333" stroke="#30363d"/>
    <text x="372" y="478" text-anchor="middle" fill="#E6EDF3" font-size="14" font-weight="600">PROPOSED CHANGES</text>
    <text x="372" y="496" text-anchor="middle" fill="#8B949E" font-size="10">old value &#8594; new value, source attached,</text>
    <text x="372" y="512" text-anchor="middle" fill="#8B949E" font-size="10">side by side, reversible</text>
  </g>

  <!-- 6 change review gate -->
  <g filter="url(#e-glow)">
    <rect x="222" y="552" width="300" height="74" rx="9" fill="#0d1117" stroke="#4A9ECE" stroke-width="1.6"/>
  </g>
  <text x="372" y="582" text-anchor="middle" fill="#4A9ECE" font-size="14" font-weight="800">&#9608;&#9608; CHANGE REVIEW &#9608;&#9608;</text>
  <text x="372" y="602" text-anchor="middle" fill="#8B949E" font-size="10">a person approves before the record moves &#183;</text>
  <text x="372" y="616" text-anchor="middle" fill="#8B949E" font-size="9.5">seconds per change, the preview did the work</text>

  <text x="712" y="420" text-anchor="middle" fill="#484F58" font-size="10" transform="rotate(90 712 420)">GOLDEN RECORDS &#183; RE-SCORED WHEN ANYTHING CHANGES</text>

  <!-- 7 record updated -->
  <g>
    <rect x="232" y="650" width="280" height="64" rx="9" fill="#1c2333" stroke="#98C379"/>
    <text x="372" y="676" text-anchor="middle" fill="#98C379" font-size="14" font-weight="700">RECORD UPDATED</text>
    <text x="372" y="694" text-anchor="middle" fill="#8B949E" font-size="10">with provenance on every field</text>
  </g>

  <!-- outputs -->
  <g>
    <rect x="142" y="750" width="180" height="58" rx="9" fill="#1c2333" stroke="#30363d"/>
    <text x="232" y="774" text-anchor="middle" fill="#E6EDF3" font-size="12" font-weight="600">AUDIT TRAIL</text>
    <text x="232" y="792" text-anchor="middle" fill="#8B949E" font-size="9.5">every change explainable</text>
  </g>
  <g>
    <rect x="422" y="750" width="180" height="58" rx="9" fill="#1c2333" stroke="#30363d"/>
    <text x="512" y="774" text-anchor="middle" fill="#E6EDF3" font-size="12" font-weight="600">PRIOR STATE KEPT</text>
    <text x="512" y="792" text-anchor="middle" fill="#8B949E" font-size="9.5">one click to undo</text>
  </g>

  <text x="372" y="844" text-anchor="middle" fill="#8B949E" font-size="11" font-style="italic">"An enrichment is a claim. The record holds evidence."</text>
  <text x="372" y="866" text-anchor="middle" fill="#484F58" font-size="10" letter-spacing="1">MAGNETIZ.AI &#183; PLAYBOOK 06 &#183; CRM ENRICHMENT WITH CHANGE REVIEW</text>
</svg>
